    <style>
        * {
            box-sizing: border-box;

            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #game-container {
            background: white;
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.1rem;
        }
        #score-board {
            background: #27ae60;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        #game-screen {
            padding: 25px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .level-card {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 5px solid #3498db;
        }
        .level-card:hover {
            background: #e2e8f0;
            transform: translateX(3px);
        }
        .meta-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: bold;
        }
        .dialogue-box {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .culture-box {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 0.88rem;
            color: #92400e;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        button.btn-option {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.98rem;
            text-align: left;
            transition: background 0.2s;
        }
        button.btn-option:hover {
            background-color: #2980b9;
        }
        button.btn-option:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .nav-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button.btn-nav {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        button.btn-next {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
        }
        .correct { background: #dcfce7; color: #166534; }
        .wrong { background: #fee2e2; color: #991b1b; }
    </style>
</head>

            { dialogue: "Bentuk penutup cerita pengalaman yang baik adalah...", options: [{text:"Saya berharap bisa berkunjung lagi ke sana.", correct:true}, {text:"Saya tidak mau tahu.", correct:false}, {text:"Siapa nama Anda?", correct:false}] }
        ]

];

let globalScore = 0;
let currentUnitIdx = 0;
let currentQuestionIdx = 0;

function showMainMenu() {
    const screen = document.getElementById('game-screen');
    let html = `<h2>Pilih Unit Pembelajaran (10 Soal per Unit):</h2><div class="level-grid">`;
    
    unitsData.forEach((u, index) => {
        html += `
            <div class="level-card" onclick="startUnit(${index})">
                <strong>${u.title}</strong>
                <p style="font-size:0.8rem; color:#64748b; margin-top:5px;">10 Pertanyaan</p>
            </div>
        `;
    });
    
    html += `</div>`;
    screen.innerHTML = html;
}

function startUnit(unitIdx) {
    currentUnitIdx = unitIdx;
    currentQuestionIdx = 0;
    loadQuestion();
}

function loadQuestion() {
    const unit = unitsData[currentUnitIdx];
    const q = unit.questions[currentQuestionIdx];
    const screen = document.getElementById('game-screen');
    
    let html = `
        <div class="meta-info">
            <span>${unit.title}</span>
            <span>Soal ${currentQuestionIdx + 1} dari 10</span>
        </div>
        <div class="culture-box">${unit.culture}</div>
        <div class="dialogue-box">${q.dialogue}</div>
        <div class="options-grid">
    `;
    
    q.options.forEach((opt) => {
        html += `<button class="btn-option" onclick="checkAnswer(${opt.correct})">${opt.text}</button>`;
    });
    
    html += `</div><div id="feedback-area"></div>
        <div class="nav-actions">
            <button class="btn-nav" onclick="showMainMenu()">⬅️ Menu Utama</button>
        </div>`;
    
    screen.innerHTML = html;
}

function checkAnswer(isCorrect) {
    const feedbackArea = document.getElementById('feedback-area');
    const buttons = document.querySelectorAll('.btn-option');
    buttons.forEach(btn => btn.disabled = true);
    
    if (isCorrect) {
        globalScore += 10;
        document.getElementById('score').innerText = globalScore;
        feedbackArea.innerHTML = `<div class="feedback correct">🎉 Benar! (+10 Poin)</div>`;
    } else {
        feedbackArea.innerHTML = `<div class="feedback wrong">❌ Jawaban kurang tepat.</div>`;
    }
    
    const navActions = document.querySelector('.nav-actions');
    if (currentQuestionIdx < 9) {
        navActions.innerHTML += `<button class="btn-next" onclick="nextQuestion()">Pertanyaan Selanjutnya ➡️</button>`;
    } else {
        navActions.innerHTML += `<button class="btn-next" onclick="finishUnit()">Selesaikan Unit 🏆</button>`;
    }
}

function nextQuestion() {
    currentQuestionIdx++;
    loadQuestion();
}

function finishUnit() {
    const screen = document.getElementById('game-screen');
    screen.innerHTML = `
        <div style="text-align:center; padding: 20px;">
            <h2>🏆 Selamat!</h2>
            <p style="margin: 15px 0; font-size: 1.1rem;">Anda telah menyelesaikan <strong>${unitsData[currentUnitIdx].title}</strong>!</p>
            <p>Total Skor Anda saat ini: <strong>${globalScore}</strong></p>
            <br>
            <button class="btn-next" onclick="showMainMenu()">Kembali ke Pilih Unit</button>
        </div>
    `;
}

// Jalankan game saat awal dimuat
showMainMenu();
</script>
